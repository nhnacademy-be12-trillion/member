<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>휴면 계정 해제</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #step-2 { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>휴면 계정 복구</h2>
    <p style="text-align: center; font-size: 0.9rem; color: #888;">
        장기간 미접속으로 계정이 보호되었습니다.<br>
        두레이 훅을 통해 본인 인증을 진행해주세요.
    </p>

    <div id="step-1">
        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" readonly> </div>
        <div class="input-group">
            <label for="doorayUrl">두레이 훅 URL</label>
            <input type="text" id="doorayUrl" placeholder="https://hook.dooray.com/services/...">
        </div>
        <button onclick="requestVerification()" id="btn-request">인증번호 전송</button>
    </div>

    <div id="step-2">
        <div class="input-group">
            <label for="authCode">인증번호</label>
            <input type="text" id="authCode" placeholder="6자리 숫자 입력">
        </div>
        <button onclick="verifyCode()" id="btn-verify">인증 확인</button>
    </div>
</div>

<script>
    // URL 파라미터에서 이메일 추출하여 input에 세팅
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = email;
        } else {
            alert("잘못된 접근입니다.");
            window.location.href = "/login";
        }
    });

    // 인증번호 발송 요청
    function requestVerification() {
        const email = document.getElementById('email').value;
        const doorayUrl = document.getElementById('doorayUrl').value;
        const btn = document.getElementById('btn-request');

        if (!doorayUrl) {
            alert("두레이 훅 URL을 입력해주세요.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "전송 중...";

        fetch('/api/members/dormant/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, doorayHookUrl: doorayUrl })
        })
            .then(response => {
                if (response.ok) {
                    alert("두레이로 인증번호가 전송되었습니다.");
                    document.getElementById('step-2').style.display = 'block'; // 다음 단계 보이기
                    document.getElementById('doorayUrl').readOnly = true; // URL 수정 못하게 막음
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                alert("전송 실패: " + error.message);
                btn.disabled = false;
                btn.innerText = "인증번호 전송";
            });
    }

    // 인증번호 검증 및 해제 요청
    function verifyCode() {
        const email = document.getElementById('email').value;
        const authCode = document.getElementById('authCode').value;

        if (!authCode) {
            alert("인증번호를 입력해주세요.");
            return;
        }

        fetch('/api/members/dormant/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, verificationCode: authCode })
        })
            .then(response => {
                if (response.ok) {
                    alert("휴면 상태가 해제되었습니다! 다시 로그인해주세요.");
                    window.location.href = "/login"; // 로그인 페이지로 이동
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                alert("인증 실패: " + error.message);
            });
    }
</script>

</body>
</html>
